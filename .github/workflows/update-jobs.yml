name: Update government jobs daily

on:
  schedule:
    - cron: "30 1,7,13 * * *"   # 3 times a day (07:00, 13:00, 19:00 IST)
  workflow_dispatch: {}          # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest jobs
        run: python fetcher/fetch_jobs.py
      - name: Commit changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
          git push
